<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Country Wordle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    :root {
        color-scheme: dark;
        --bg: #0a1828;
        --surface: #112741;
        --surface-2: #17344f;
        --line: #24435f;
        --ink: #f2f6fa;
        --muted: #8ea6bb;
        --primary: #ff7a3d;
        --primary-ink: #1a0e07;
        --match: #35d6a0;
        --high: #ffc83d;
        --low: #59b4ff;
        --miss: #ff6b7a;
        --display: 'Bricolage Grotesque', 'Trebuchet MS', 'Segoe UI', sans-serif;
        --body: 'DM Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--body);
        font-size: 16px;
        line-height: 1.5;
        padding: 28px 16px 64px;
    }
    /* quiet latitude rings behind everything */
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background: repeating-radial-gradient(circle at 50% -10%, transparent 0 86px, rgba(255,255,255,.04) 86px 87px);
        pointer-events: none;
    }
    .container { max-width: 640px; margin: 0 auto; }

    /* ---------- header ---------- */
    header { text-align: center; margin-bottom: 28px; }
    .flag-trio { display: flex; justify-content: center; margin-bottom: 14px; height: 56px; }
    .flag-trio img {
        width: 76px; height: 52px; object-fit: cover;
        border-radius: 8px;
        border: 3px solid var(--bg);
        box-shadow: 0 6px 16px rgba(0,0,0,.35);
        margin: 0 -10px;
        background: var(--surface-2);
    }
    .flag-trio img:nth-child(1) { transform: rotate(-9deg) translateY(4px); }
    .flag-trio img:nth-child(2) { transform: translateY(-4px); z-index: 1; }
    .flag-trio img:nth-child(3) { transform: rotate(9deg) translateY(4px); }
    h1 {
        font-family: var(--display);
        font-weight: 800;
        font-size: clamp(2.4rem, 9vw, 3.6rem);
        line-height: 1;
        letter-spacing: -0.03em;
        margin: 0 0 10px;
    }
    .tagline { margin: 0; color: var(--muted); }

    /* ---------- guess form ---------- */
    .guess-bar { position: relative; }
    .field {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--surface);
        border: 2px solid var(--line);
        border-radius: 16px;
        padding: 6px 6px 6px 12px;
        transition: border-color .15s, box-shadow .15s;
    }
    .field:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(255,122,61,.18); }
    .field.shake { animation: shake .35s; border-color: var(--miss); }
    .input-flag {
        flex: none;
        width: 36px; height: 26px;
        border-radius: 5px;
        background: var(--surface-2) center/cover no-repeat;
        display: grid; place-items: center;
        font-size: 16px;
        overflow: hidden;
    }
    .input-flag img { width: 100%; height: 100%; object-fit: cover; display: block; }
    #guessInput {
        flex: 1;
        min-width: 0;
        background: transparent;
        border: 0;
        outline: 0;
        color: var(--ink);
        font: inherit;
        font-size: 1.05rem;
        padding: 10px 0;
    }
    #guessInput::placeholder { color: var(--muted); }
    #guessInput:disabled { opacity: .5; }
    button { font: inherit; cursor: pointer; border: 0; }
    .btn-guess {
        background: var(--primary);
        color: var(--primary-ink);
        font-weight: 700;
        padding: 11px 22px;
        border-radius: 11px;
        transition: transform .1s, filter .15s;
    }
    .btn-guess:hover:not(:disabled) { filter: brightness(1.08); }
    .btn-guess:active:not(:disabled) { transform: scale(.96); }
    .btn-guess:disabled { opacity: .45; cursor: not-allowed; }
    button:focus-visible, .chip:focus-visible, .suggest li:focus-visible { outline: 3px solid var(--low); outline-offset: 2px; }

    .suggest {
        position: absolute; left: 0; right: 0; top: calc(100% + 6px);
        z-index: 5;
        list-style: none; margin: 0; padding: 6px;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 18px 40px rgba(0,0,0,.45);
    }
    .suggest[hidden] { display: none; }
    .suggest li {
        display: flex; align-items: center; gap: 12px;
        padding: 8px 10px;
        border-radius: 9px;
        cursor: pointer;
    }
    .suggest li:hover, .suggest li[aria-selected="true"] { background: rgba(255,255,255,.08); }
    .suggest img { width: 28px; height: 20px; object-fit: cover; border-radius: 3px; }

    .actions { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding: 0 4px; gap: 12px; }
    .actions .left { display: flex; gap: 8px; }
    .btn-quiet {
        background: transparent;
        color: var(--muted);
        padding: 8px 14px;
        border-radius: 10px;
        border: 1px solid var(--line);
        transition: color .15s, border-color .15s, background .15s;
    }
    .btn-quiet:hover { color: var(--ink); border-color: var(--muted); background: rgba(255,255,255,.04); }
    .btn-quiet.pulse { color: var(--primary-ink); background: var(--primary); border-color: var(--primary); font-weight: 700; }
    #counter { color: var(--muted); font-size: .9rem; }

    #message { min-height: 1.5em; margin: 14px 4px 0; color: var(--miss); font-size: .95rem; }
    #message.info { color: var(--match); }
    .link { background: none; color: var(--high); text-decoration: underline; text-underline-offset: 3px; padding: 0; font-weight: 700; }

    /* ---------- result cards ---------- */
    #results { margin-top: 12px; display: grid; gap: 14px; }
    .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 14px;
    }
    .card.fresh { animation: pop .4s cubic-bezier(.2,1.2,.4,1); }
    .card-head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
    .flag {
        flex: none;
        width: 68px; height: 46px;
        object-fit: cover;
        border-radius: 7px;
        border: 2px solid rgba(255,255,255,.12);
        background: var(--surface-2);
        box-shadow: 0 4px 10px rgba(0,0,0,.3);
    }
    .flag-fallback {
        flex: none; width: 68px; height: 46px; border-radius: 7px;
        display: grid; place-items: center; font-size: 24px;
        background: var(--surface-2); border: 2px dashed var(--line);
    }
    .card-title { margin: 0; font-family: var(--display); font-weight: 700; font-size: 1.3rem; line-height: 1.15; letter-spacing: -0.01em; }
    .card-sub { margin: 2px 0 0; color: var(--muted); font-size: .85rem; }

    .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    @media (min-width: 560px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
    .tile {
        background: var(--surface-2);
        border-radius: 12px;
        padding: 10px 12px;
        border-left: 4px solid var(--line);
        min-width: 0;
    }
    .tile-label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 2px; }
    .tile-value { display: flex; align-items: baseline; gap: 6px; font-weight: 700; font-size: .98rem; overflow-wrap: anywhere; }
    .tile-ico { font-size: .8rem; flex: none; }
    .tile.match { border-left-color: var(--match); background: rgba(53,214,160,.12); }
    .tile.match .tile-ico { color: var(--match); }
    .tile.high { border-left-color: var(--high); background: rgba(255,200,61,.1); }
    .tile.high .tile-ico { color: var(--high); }
    .tile.low { border-left-color: var(--low); background: rgba(89,180,255,.1); }
    .tile.low .tile-ico { color: var(--low); }
    .tile.miss { border-left-color: var(--miss); background: rgba(255,107,122,.1); }
    .tile.miss .tile-ico { color: var(--miss); }

    .end-card { text-align: center; padding: 26px 18px; }
    .end-card .flag-big { width: 150px; height: 100px; object-fit: cover; border-radius: 12px; border: 3px solid rgba(255,255,255,.15); box-shadow: 0 12px 28px rgba(0,0,0,.4); transform: rotate(-3deg); }
    .end-card h2 { font-family: var(--display); font-weight: 800; font-size: 1.9rem; letter-spacing: -0.02em; margin: 18px 0 6px; line-height: 1.1; }
    .end-card p { margin: 4px 0; color: var(--muted); }
    .end-card .score { color: var(--ink); font-weight: 700; font-size: 1.1rem; }
    .end-card.win { border-color: var(--match); box-shadow: 0 0 0 4px rgba(53,214,160,.12); }
    .end-card.lose { border-color: var(--miss); box-shadow: 0 0 0 4px rgba(255,107,122,.1); }

    .empty { text-align: center; color: var(--muted); padding: 28px 8px; border: 2px dashed var(--line); border-radius: 18px; }

    /* ---------- help dialog ---------- */
    dialog {
        width: min(560px, calc(100vw - 24px));
        max-height: 80vh;
        background: var(--surface);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 0;
        box-shadow: 0 30px 80px rgba(0,0,0,.6);
    }
    dialog::backdrop { background: rgba(4,10,18,.7); backdrop-filter: blur(3px); }
    .dlg-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 6px; }
    .dlg-head h2 { margin: 0; font-family: var(--display); font-size: 1.35rem; letter-spacing: -0.01em; }
    .dlg-close { background: var(--surface-2); color: var(--ink); width: 34px; height: 34px; border-radius: 50%; font-size: 1rem; }
    .dlg-note { margin: 0; padding: 0 20px 12px; color: var(--muted); font-size: .9rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 20px 20px; overflow-y: auto; max-height: calc(80vh - 110px); }
    .chip {
        display: inline-flex; align-items: center; gap: 8px;
        background: var(--surface-2); color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 12px 5px 6px;
        font-size: .9rem;
        transition: border-color .15s, transform .1s;
    }
    .chip:hover { border-color: var(--primary); }
    .chip:active { transform: scale(.96); }
    .chip img { width: 26px; height: 18px; object-fit: cover; border-radius: 3px; }

    /* ---------- motion ---------- */
    @keyframes pop { from { opacity: 0; transform: translateY(-10px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
        html { scroll-behavior: auto; }
    }
</style>
</head>
<body>
<div class="container">
    <header>
        <div class="flag-trio" id="flagTrio" aria-hidden="true"></div>
        <h1>Country Wordle</h1>
        <p class="tagline">Guess the hidden country. Every guess shows how close you are.</p>
    </header>

    <main>
        <div class="guess-bar">
            <div class="field" id="field">
                <span class="input-flag" id="inputFlag" aria-hidden="true">🌍</span>
                <input type="text" id="guessInput" placeholder="Type a country name" autocomplete="off" autocapitalize="words" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="suggest" aria-label="Country name" autofocus>
                <button class="btn-guess" id="guessBtn" onclick="submitGuess()">Guess</button>
            </div>
            <ul class="suggest" id="suggest" role="listbox" hidden></ul>
        </div>

        <div class="actions">
            <div class="left">
                <button class="btn-quiet" id="helpBtn" onclick="requestHelp()">Help</button>
                <button class="btn-quiet" id="restartBtn" onclick="restartGame()">New game</button>
            </div>
            <span id="counter" aria-live="polite"></span>
        </div>

        <div id="message" role="status" aria-live="polite"></div>
        <div id="results"><div class="empty" id="empty">No guesses yet. Pick any country to get your first clues.</div></div>
    </main>
</div>

<dialog id="helpDialog" aria-labelledby="helpTitle">
    <div class="dlg-head">
        <h2 id="helpTitle">Still in the running</h2>
        <button class="dlg-close" onclick="document.getElementById('helpDialog').close()" aria-label="Close">✕</button>
    </div>
    <p class="dlg-note">Tap a country to use it as your next guess.</p>
    <div class="chips" id="helpChips"></div>
</dialog>

<script>
    /* ---------- flags ---------- */
    const COUNTRIES = [
        ["Afghanistan","af"],["Albania","al"],["Algeria","dz"],["Andorra","ad"],["Angola","ao"],["Antigua and Barbuda","ag"],["Argentina","ar"],["Armenia","am"],["Australia","au"],["Austria","at"],["Azerbaijan","az"],
        ["Bahamas","bs"],["Bahrain","bh"],["Bangladesh","bd"],["Barbados","bb"],["Belarus","by"],["Belgium","be"],["Belize","bz"],["Benin","bj"],["Bhutan","bt"],["Bolivia","bo"],["Bosnia and Herzegovina","ba"],["Botswana","bw"],["Brazil","br"],["Brunei","bn"],["Bulgaria","bg"],["Burkina Faso","bf"],["Burundi","bi"],
        ["Cabo Verde","cv"],["Cambodia","kh"],["Cameroon","cm"],["Canada","ca"],["Central African Republic","cf"],["Chad","td"],["Chile","cl"],["China","cn"],["Colombia","co"],["Comoros","km"],["Congo","cg"],["Costa Rica","cr"],["Côte d'Ivoire","ci"],["Croatia","hr"],["Cuba","cu"],["Cyprus","cy"],["Czechia","cz"],
        ["DR Congo","cd"],["Denmark","dk"],["Djibouti","dj"],["Dominica","dm"],["Dominican Republic","do"],
        ["Ecuador","ec"],["Egypt","eg"],["El Salvador","sv"],["Equatorial Guinea","gq"],["Eritrea","er"],["Estonia","ee"],["Eswatini","sz"],["Ethiopia","et"],
        ["Fiji","fj"],["Finland","fi"],["France","fr"],
        ["Gabon","ga"],["Gambia","gm"],["Georgia","ge"],["Germany","de"],["Ghana","gh"],["Greece","gr"],["Grenada","gd"],["Guatemala","gt"],["Guinea","gn"],["Guinea-Bissau","gw"],["Guyana","gy"],
        ["Haiti","ht"],["Honduras","hn"],["Hungary","hu"],
        ["Iceland","is"],["India","in"],["Indonesia","id"],["Iran","ir"],["Iraq","iq"],["Ireland","ie"],["Israel","il"],["Italy","it"],
        ["Jamaica","jm"],["Japan","jp"],["Jordan","jo"],
        ["Kazakhstan","kz"],["Kenya","ke"],["Kiribati","ki"],["Kuwait","kw"],["Kyrgyzstan","kg"],
        ["Laos","la"],["Latvia","lv"],["Lebanon","lb"],["Lesotho","ls"],["Liberia","lr"],["Libya","ly"],["Liechtenstein","li"],["Lithuania","lt"],["Luxembourg","lu"],
        ["Madagascar","mg"],["Malawi","mw"],["Malaysia","my"],["Maldives","mv"],["Mali","ml"],["Malta","mt"],["Marshall Islands","mh"],["Mauritania","mr"],["Mauritius","mu"],["Mexico","mx"],["Micronesia","fm"],["Moldova","md"],["Monaco","mc"],["Mongolia","mn"],["Montenegro","me"],["Morocco","ma"],["Mozambique","mz"],["Myanmar","mm"],
        ["Namibia","na"],["Nauru","nr"],["Nepal","np"],["Netherlands","nl"],["New Zealand","nz"],["Nicaragua","ni"],["Niger","ne"],["Nigeria","ng"],["North Korea","kp"],["North Macedonia","mk"],["Norway","no"],
        ["Oman","om"],
        ["Pakistan","pk"],["Palau","pw"],["Panama","pa"],["Papua New Guinea","pg"],["Paraguay","py"],["Peru","pe"],["Philippines","ph"],["Poland","pl"],["Portugal","pt"],
        ["Qatar","qa"],
        ["Romania","ro"],["Russia","ru"],["Rwanda","rw"],
        ["Saint Kitts and Nevis","kn"],["Saint Lucia","lc"],["Saint Vincent and the Grenadines","vc"],["Samoa","ws"],["San Marino","sm"],["Sao Tome and Principe","st"],["Saudi Arabia","sa"],["Senegal","sn"],["Serbia","rs"],["Seychelles","sc"],["Sierra Leone","sl"],["Singapore","sg"],["Slovakia","sk"],["Slovenia","si"],["Solomon Islands","sb"],["Somalia","so"],["South Africa","za"],["South Korea","kr"],["South Sudan","ss"],["Spain","es"],["Sri Lanka","lk"],["Sudan","sd"],["Suriname","sr"],["Sweden","se"],["Switzerland","ch"],["Syria","sy"],
        ["Tajikistan","tj"],["Tanzania","tz"],["Thailand","th"],["Timor-Leste","tl"],["Togo","tg"],["Tonga","to"],["Trinidad and Tobago","tt"],["Tunisia","tn"],["Turkey","tr"],["Turkmenistan","tm"],["Tuvalu","tv"],
        ["Uganda","ug"],["Ukraine","ua"],["United Arab Emirates","ae"],["United Kingdom","gb"],["United States","us"],["Uruguay","uy"],["Uzbekistan","uz"],
        ["Vanuatu","vu"],["Vatican City","va"],["Venezuela","ve"],["Vietnam","vn"],
        ["Yemen","ye"],["Zambia","zm"],["Zimbabwe","zw"]
    ];
    const ALIASES = [
        ["usa","us"],["us","us"],["america","us"],["united states of america","us"],
        ["uk","gb"],["great britain","gb"],["britain","gb"],["england","gb"],
        ["uae","ae"],["czech republic","cz"],["turkiye","tr"],["ivory coast","ci"],["cape verde","cv"],
        ["swaziland","sz"],["burma","mm"],["east timor","tl"],["macedonia","mk"],
        ["democratic republic of the congo","cd"],["dr congo","cd"],["drc","cd"],["congo kinshasa","cd"],["congo democratic republic","cd"],
        ["republic of the congo","cg"],["congo brazzaville","cg"],["congo republic","cg"],
        ["korea south","kr"],["republic of korea","kr"],["korea","kr"],["korea north","kp"],["dprk","kp"],
        ["russian federation","ru"],["micronesia federated states of","fm"],["federated states of micronesia","fm"],
        ["holy see","va"],["vatican","va"],["sao tome","st"],["bosnia","ba"],["trinidad","tt"],["saint vincent","vc"],["antigua","ag"],["st kitts and nevis","kn"],
        ["syrian arab republic","sy"],["viet nam","vn"],["lao pdr","la"],["laos people's democratic republic","la"],["timor leste","tl"],
        ["tanzania united republic of","tz"],["moldova republic of","md"],["iran islamic republic of","ir"],["bolivia plurinational state of","bo"],["venezuela bolivarian republic of","ve"],
        ["the bahamas","bs"],["the gambia","gm"],["the netherlands","nl"]
    ];

    function norm(s) {
        return String(s).toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/&/g, ' and ')
            .replace(/[^a-z0-9\s-]/g, '')
            .replace(/-/g, ' ')
            .replace(/\bst\b/g, 'saint')
            .replace(/^the\s+/, '')
            .replace(/\s+/g, ' ')
            .trim();
    }
    const FLAG_MAP = new Map();
    COUNTRIES.forEach(([n, c]) => FLAG_MAP.set(norm(n), c));
    ALIASES.forEach(([n, c]) => FLAG_MAP.set(norm(n), c));

    function flagCode(name) { return FLAG_MAP.get(norm(name)) || null; }
    function flagUrl(code, w) { return `https://flagcdn.com/w${w}/${code}.png`; }
    function esc(s) {
        return String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function flagImg(name, cls, w = 160) {
        const code = flagCode(name);
        if (!code) return `<span class="flag-fallback" aria-hidden="true">🌍</span>`;
        return `<img class="${cls}" src="${flagUrl(code, w)}" srcset="${flagUrl(code, w * 2)} 2x" alt="Flag of ${esc(name)}" loading="lazy" onerror="this.outerHTML='<span class=&quot;flag-fallback&quot; aria-hidden=&quot;true&quot;>🌍</span>'">`;
    }

    /* ---------- header flags ---------- */
    (function () {
        const picks = [...COUNTRIES].sort(() => Math.random() - 0.5).slice(0, 3);
        document.getElementById('flagTrio').innerHTML = picks
            .map(([n, c]) => `<img src="${flagUrl(c, 160)}" alt="" onerror="this.style.display='none'">`).join('');
    })();

    /* ---------- state ---------- */
    let finished = false;
    const input = document.getElementById('guessInput');
    const guessBtn = document.getElementById('guessBtn');
    const msg = document.getElementById('message');
    const resultsDiv = document.getElementById('results');
    const counter = document.getElementById('counter');

    function setMessage(html, info = false) {
        msg.className = info ? 'info' : '';
        msg.innerHTML = html;
    }
    function setFinished(v) {
        finished = v;
        input.disabled = v;
        guessBtn.disabled = v;
        document.getElementById('restartBtn').classList.toggle('pulse', v);
        if (v) hideSuggest();
    }
    function clearEmpty() { const e = document.getElementById('empty'); if (e) e.remove(); }
    function prepend(html) {
        clearEmpty();
        resultsDiv.insertAdjacentHTML('afterbegin', html);
    }

    /* ---------- hint styling ---------- */
    function hintState(text) {
        const t = String(text ?? '').toLowerCase();
        if (/(✅|✔|🟩|match|correct|same|exact)/.test(t)) return 'match';
        if (/(⬆|↑|🔼|📈|higher|more|bigger|larger|greater|above)/.test(t)) return 'high';
        if (/(⬇|↓|🔽|📉|lower|less|smaller|fewer|below)/.test(t)) return 'low';
        if (/(❌|🟥|wrong|incorrect|different|no\b)/.test(t)) return 'miss';
        return '';
    }
    const ICONS = { match: '✓', high: '▲', low: '▼', miss: '✕', '': '' };
    function tile(label, value) {
        const state = hintState(value);
        const clean = String(value ?? '').replace(/^[\s↑↓⬆⬇️✅❌✔✓✕🔼🔽📈📉🟩🟨🟥]+/u, '');
        const icon = ICONS[state] ? `<span class="tile-ico" aria-hidden="true">${ICONS[state]}</span>` : '';
        return `<div class="tile ${state}"><span class="tile-label">${esc(label)}</span><span class="tile-value">${icon}<span>${esc(clean || value)}</span></span></div>`;
    }

    /* ---------- confetti ---------- */
    function confetti() {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const colors = ['#ff7a3d', '#35d6a0', '#ffc83d', '#59b4ff', '#ff6b7a', '#ffffff'];
        for (let i = 0; i < 60; i++) {
            const p = document.createElement('div');
            const size = 6 + Math.random() * 8;
            Object.assign(p.style, {
                position: 'fixed', top: '-12px', left: Math.random() * 100 + 'vw',
                width: size + 'px', height: size * 0.6 + 'px',
                background: colors[i % colors.length], borderRadius: '2px',
                zIndex: 50, pointerEvents: 'none'
            });
            document.body.appendChild(p);
            const drift = (Math.random() - 0.5) * 240;
            const anim = p.animate([
                { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
                { transform: `translate(${drift}px, 105vh) rotate(${Math.random() * 900}deg)`, opacity: 1 }
            ], { duration: 1800 + Math.random() * 1600, easing: 'cubic-bezier(.2,.6,.4,1)', delay: Math.random() * 350 });
            anim.onfinish = () => p.remove();
        }
    }

    /* ---------- guessing ---------- */
    async function submitGuess(valueOverride) {
        if (finished) return;
        const val = (valueOverride ?? input.value).trim();
        if (!val) return;
        hideSuggest();

        let data;
        try {
            const res = await fetch('/api/guess', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ guess: val })
            });
            data = await res.json();
        } catch (e) {
            setMessage("Can't reach the game server. Check that it's running and try again.");
            return;
        }

        setMessage('');

        if (!data.valid) {
            const field = document.getElementById('field');
            field.classList.remove('shake'); void field.offsetWidth; field.classList.add('shake');
            let html = esc(data.message || "That isn't a country in the game.");
            if (data.suggestion) {
                html += ` Did you mean <button class="link" data-suggestion="${esc(data.suggestion)}">${esc(data.suggestion)}</button>?`;
            }
            setMessage(html);
            return;
        }

        input.value = '';
        updateInputFlag('');
        if (data.guess_count != null) counter.textContent = `${data.guess_count} ${data.guess_count === 1 ? 'guess' : 'guesses'}`;

        if (data.correct) {
            prepend(`<div class="card end-card win fresh">
                ${flagImg(data.target, 'flag-big', 320)}
                <h2>You got it: ${esc(data.target)}!</h2>
                <p>Total guesses: ${esc(data.guess_count)}</p>
                <p class="score">Score: ${esc(data.score)} / 1000</p>
            </div>`);
            setFinished(true);
            confetti();
            return;
        }

        if (data.game_over_limit) {
            prepend(`<div class="card end-card lose fresh">
                ${flagImg(data.target, 'flag-big', 320)}
                <h2>Out of guesses</h2>
                <p>The country was <strong>${esc(data.target)}</strong>.</p>
            </div>`);
            setFinished(true);
            return;
        }

        const h = data.hints || {};
        prepend(`<div class="card fresh">
            <div class="card-head">
                ${flagImg(data.country, 'flag')}
                <div>
                    <h3 class="card-title">${esc(data.country)}</h3>
                    <p class="card-sub">Guess #${esc(data.guess_count)}</p>
                </div>
            </div>
            <div class="tiles">
                ${tile('Population', h.pop)}
                ${tile('Area', h.km2)}
                ${tile('GDP', h.gdp)}
                ${tile('Continent', h.continent)}
            </div>
        </div>`);
    }

    msg.addEventListener('click', e => {
        const btn = e.target.closest('[data-suggestion]');
        if (btn) submitGuess(btn.dataset.suggestion);
    });

    /* ---------- help ---------- */
    async function requestHelp() {
        let data;
        try {
            const res = await fetch('/api/help');
            data = await res.json();
        } catch (e) {
            setMessage("Can't reach the game server. Check that it's running and try again.");
            return;
        }
        if (data.message) { setMessage(esc(data.message)); return; }

        document.getElementById('helpTitle').textContent = `Still in the running (${data.count})`;
        document.getElementById('helpChips').innerHTML = (data.remaining || []).map(n =>
            `<button class="chip" data-name="${esc(n)}">${flagCode(n) ? `<img src="${flagUrl(flagCode(n), 40)}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}${esc(n)}</button>`
        ).join('');
        const dlg = document.getElementById('helpDialog');
        if (!dlg.open) dlg.showModal();
    }
    document.getElementById('helpChips').addEventListener('click', e => {
        const chip = e.target.closest('.chip');
        if (!chip) return;
        document.getElementById('helpDialog').close();
        input.value = chip.dataset.name;
        updateInputFlag(chip.dataset.name);
        input.focus();
    });
    document.getElementById('helpDialog').addEventListener('click', e => {
        if (e.target === e.currentTarget) e.currentTarget.close();
    });

    /* ---------- restart ---------- */
    async function restartGame() {
        try { await fetch('/api/restart', { method: 'POST' }); }
        catch (e) { setMessage("Can't reach the game server. Check that it's running and try again."); return; }
        resultsDiv.innerHTML = '<div class="empty" id="empty">No guesses yet. Pick any country to get your first clues.</div>';
        counter.textContent = '';
        setFinished(false);
        input.value = '';
        updateInputFlag('');
        setMessage('New game started. Good luck!', true);
        input.focus();
    }

    /* ---------- autocomplete + live flag preview ---------- */
    const suggestEl = document.getElementById('suggest');
    const inputFlag = document.getElementById('inputFlag');
    let activeIdx = -1;
    let options = [];

    function updateInputFlag(name) {
        const code = name ? flagCode(name) : null;
        inputFlag.innerHTML = code
            ? `<img src="${flagUrl(code, 80)}" alt="" onerror="this.parentNode.textContent='🌍'">`
            : '🌍';
    }
    function hideSuggest() {
        suggestEl.hidden = true;
        input.setAttribute('aria-expanded', 'false');
        activeIdx = -1;
    }
    function renderSuggest() {
        suggestEl.innerHTML = options.map(([n, c], i) =>
            `<li role="option" data-name="${esc(n)}" aria-selected="${i === activeIdx}"><img src="${flagUrl(c, 40)}" alt="" loading="lazy" onerror="this.style.display='none'">${esc(n)}</li>`
        ).join('');
        suggestEl.hidden = options.length === 0;
        input.setAttribute('aria-expanded', String(options.length > 0));
    }
    input.addEventListener('input', () => {
        const q = norm(input.value);
        updateInputFlag(input.value);
        if (!q) { options = []; hideSuggest(); return; }
        const starts = [], contains = [];
        COUNTRIES.forEach(item => {
            const n = norm(item[0]);
            if (n.startsWith(q)) starts.push(item);
            else if (n.includes(q)) contains.push(item);
        });
        options = [...starts, ...contains].slice(0, 6);
        // hide the list when the field already holds an exact match
        if (options.length === 1 && norm(options[0][0]) === q) options = [];
        activeIdx = -1;
        renderSuggest();
    });
    suggestEl.addEventListener('mousedown', e => {
        const li = e.target.closest('li');
        if (!li) return;
        e.preventDefault();
        input.value = li.dataset.name;
        updateInputFlag(li.dataset.name);
        hideSuggest();
        input.focus();
    });
    input.addEventListener('keydown', e => {
        if (e.key === 'ArrowDown' && options.length) {
            e.preventDefault(); activeIdx = (activeIdx + 1) % options.length; renderSuggest();
        } else if (e.key === 'ArrowUp' && options.length) {
            e.preventDefault(); activeIdx = (activeIdx - 1 + options.length) % options.length; renderSuggest();
        } else if (e.key === 'Escape') {
            hideSuggest();
        } else if (e.key === 'Enter') {
            e.preventDefault();
            if (activeIdx >= 0 && options[activeIdx]) {
                input.value = options[activeIdx][0];
                updateInputFlag(input.value);
            }
            submitGuess();
        }
    });
    input.addEventListener('blur', () => setTimeout(hideSuggest, 120));
</script>
</body>
